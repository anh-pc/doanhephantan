# ===== API Gateway / Reverse Proxy / Load Balancer =====
# Tên dịch vụ (user-service, ticket-service, frontend) được Docker DNS nội bộ phân giải.
# Nginx phân giải tên MỘT LẦN khi nạp cấu hình (start/reload). Nếu tên trả về nhiều IP
# (khi `--scale ticket-service=N`) thì mỗi IP trở thành một server trong upstream.

log_format gw '$remote_addr [$time_local] "$request" $status '
              'rid=$request_id upstream=$upstream_addr '
              'rt=$request_time urt=$upstream_response_time';
access_log /dev/stdout gw;

upstream frontend_pool {
    server frontend:80;
}

upstream user_pool {
    server user-service:3000;
}

upstream ticket_pool {
    # Thuật toán mặc định: weighted round-robin (có thể thêm `least_conn;`)
    # max_fails/fail_timeout: passive health check (in-band).
    # 2 lần lỗi trong 10s -> coi server "down" 10s rồi mới thăm dò lại.
    server ticket-service:5000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    # --- header dùng chung cho các route proxy ---
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;
    proxy_set_header Connection        "";

    # --- timeout & failover ---
    proxy_connect_timeout 1s;
    proxy_read_timeout    10s;
    proxy_next_upstream         error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries   3;
    proxy_next_upstream_timeout 5s;

    # --- header phục vụ quan sát/demo ---
    add_header X-Upstream-Addr $upstream_addr always;
    add_header X-Request-ID    $request_id    always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "gateway ok\n";
    }

    location /api/users/   { proxy_pass http://user_pool; }
    location = /api/users  { proxy_pass http://user_pool; }

    location /api/tickets/  { proxy_pass http://ticket_pool; }
    location = /api/tickets { proxy_pass http://ticket_pool; }

    location / { proxy_pass http://frontend_pool; }
}
