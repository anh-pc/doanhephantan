name: ms-demo

services:
  # ---------- API Gateway / Load Balancer (cổng duy nhất mở ra ngoài) ----------
  gateway:
    build: ./gateway
    ports:
      - "8080:80"
    depends_on:
      frontend:       { condition: service_started }
      user-service:   { condition: service_healthy }
      ticket-service: { condition: service_healthy }
    networks: [edge]
    restart: unless-stopped

  # ---------- Frontend (React, build đa tầng -> Nginx tĩnh) ----------
  frontend:
    build: ./frontend
    expose: ["80"]
    networks: [edge]

  # ---------- User Service (Node.js / Express) ----------
  user-service:
    build: ./user-service
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/users_db
    expose: ["3000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/users/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge, data]

  # ---------- Ticket Service (Python / Flask) - dịch vụ sẽ được scale ----------
  # Lưu ý: dùng `expose`, KHÔNG dùng `ports` để nhiều replica không tranh nhau cổng host.
  ticket-service:
    build: ./ticket-service
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/tickets_db
      REDIS_URL: redis://redis:6379/0
    expose: ["5000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/api/tickets/health', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge, data]

  # ---------- Hạ tầng dữ liệu (chỉ nằm trong mạng `data`) ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]

networks:
  edge: {}   # gateway <-> frontend/services
  data: {}   # services <-> postgres/redis (gateway không truy cập được)

volumes:
  pgdata: {}
